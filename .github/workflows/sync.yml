name: Sync to Hugging Face Hub

on:
  push:
    branches: [main, master] # ทำงานทุกครั้งที่มีการอัปเดตโค้ดเข้า branch main หรือ master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/dgjn/AIsuper
