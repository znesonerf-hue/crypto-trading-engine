version: '3.8'

services:
  trading-bot:
    build: .
    container_name: crypto-trading-engine
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - TRADING_MODE=paper
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge
